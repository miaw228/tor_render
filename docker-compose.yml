services:
  tor-website:
    build: .
    container_name: tor-website
    ports:
      - "8080:80"
    volumes:
      - ./app:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    restart: unless-stopped
